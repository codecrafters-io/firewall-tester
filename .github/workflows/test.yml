name: Test

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      course_ref:
        type: string
        default: main
  workflow_dispatch:
    inputs:
      course_ref:
        description: Course commit or branch to verify with this tester
        type: string
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tester
        uses: actions/checkout@v4
      - name: Checkout course references
        uses: actions/checkout@v4
        with:
          repository: codecrafters-io/build-your-own-firewall
          ref: ${{ inputs.course_ref || 'main' }}
          path: course
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Test inbound WAF curriculum
        run: make test
        env:
          WAF_COURSE_DIR: ${{ github.workspace }}/course
      - name: Test supplied model
        run: python -m unittest discover -s course/examples/waf-lab -p 'test_*.py'
      - name: Build tester
        run: make build
      - name: Verify final-stage submission interface
        run: |
          for language in go python; do
            CODECRAFTERS_REPOSITORY_DIR="$GITHUB_WORKSPACE/course/solutions/$language/10-mu9/code" \
            CODECRAFTERS_TEST_CASES_JSON='[{"slug":"mu9","tester_log_prefix":"final","title":"Virtually patch an endpoint"}]' \
              ./dist/tester
          done
